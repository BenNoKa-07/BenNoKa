
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BenNoKa Profile</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #09090d;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.profile {
  width: 100%;
  max-width: 420px;
  background: #17131a;
  border: 1px solid #ff304b;
  border-radius: 20px;
  padding: 30px 22px;
  text-align: center;
  box-shadow: 0 0 30px #ff183544;
}

.avatar {
  width: 125px;
  height: 125px;
  border-radius: 50%;
  border: 4px solid #ff304b;
  box-shadow: 0 0 25px #ff304b;
  margin: 0 auto 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  font-weight: bold;
  background: linear-gradient(135deg, #700b20, #09090d);
}

h1 {
  font-size: 30px;
  color: #ff4059;
  text-shadow: 0 0 15px #ff304b;
}

.tag {
  color: #aaa;
  margin: 10px 0 20px;
}

.bio {
  line-height: 1.8;
  color: #ddd;
  margin-bottom: 25px;
}

.stats {
  display: flex;
  justify-content: space-around;
  background: #24202a;
  padding: 17px 5px;
  border-radius: 12px;
  margin-bottom: 25px;
}

.stats b {
  display: block;
  color: #ff4059;
  margin-bottom: 5px;
}

.social a {
  display: block;
  padding: 15px;
  margin: 12px 0;
  border: 1px solid #ff304b;
  border-radius: 10px;
  color: white;
  text-decoration: none;
  font-weight: bold;
  transition: .3s;
}

.social a:hover {
  background: #ff304b;
  box-shadow: 0 0 20px #ff304b;
  transform: scale(1.03);
}

footer {
  margin-top: 25px;
  color: #888;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="profile">

  <div class="avatar">BN</div>

  <h1>BenNoKa</h1>
  <p class="tag">⚡ GAMING PRO | ROBLOX CREATOR</p>

  <div class="bio">
    🎮 Xin chào, mình là BenNoKa<br>
    🔥 Đam mê Gaming và Roblox<br>
    👑 PLAY HARD. STAY LEGENDARY.
  </div>

  <div class="stats">
    <div><b>ROBLOX</b>Game</div>
    <div><b>GAMER</b>Role</div>
    <div><b>2026</b>Year</div>
  </div>

  <div class="social">
    <a href="https://tiktok.com">♪ TikTok</a>
    <a href="https://discord.com">◈ Discord</a>
  </div>

  <footer>
    © 2026 BenNoKa | All Rights Reserved
  </footer>

</div>

</body>
</html>
